name: Bug report
description: Report a reproducible public-repository defect.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include tenant data, access tokens, credentials, or private configuration.
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Include the minimal public steps to reproduce the behavior.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
