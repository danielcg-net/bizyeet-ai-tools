name: YouTrack delivery policy

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read
  pull-requests: read

jobs:
  validate:
    name: Validate YouTrack delivery
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout policy validator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Install dependencies and test policy
        run: npm ci && npm run test
      - name: Validate branch, commits, and pull-request title
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const pull = context.payload.pull_request;
            if (!pull) {
              core.setFailed("No pull request payload found.");
              return;
            }

            const policy = await import(`${process.env.GITHUB_WORKSPACE}/dist/.github/scripts/validate-youtrack-delivery-policy.js`);
            if (policy.isTrustedDependabotAuthor(pull.user?.login)) {
              core.info("Dependabot dependency update: delivery identifier validation is not required.");
              return;
            }

            const metadata = policy.validatePullRequestMetadata({ branch: pull.head.ref, title: pull.title });
            if (metadata.errors.length > 0 || !metadata.issueId) {
              core.setFailed(metadata.errors.join("\n"));
              return;
            }

            const commits = await github.paginate(github.rest.pulls.listCommits, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pull.number,
              per_page: 100,
            });
            const errors = policy.validateCommitMessages(metadata.issueId, commits);
            if (errors.length > 0) core.setFailed(errors.join("\n"));
