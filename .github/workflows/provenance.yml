name: Verify Trusted Provenance

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trusted-provenance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'danielcg-net/bizyeet-ai-tools' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      artifact-id: ${{ steps.bundle.outputs.artifact-id }}
    steps:
      - name: Checkout trusted source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Build and verify without signing permissions
        run: |
          npm ci --ignore-scripts
          npm run release:verify
      - name: Retain verified build
        id: bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trusted-build-${{ github.sha }}
          path: release-artifacts/
          if-no-files-found: error
          retention-days: 7

  attest:
    if: github.repository == 'danielcg-net/bizyeet-ai-tools' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download only this run's verified build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: bundle
          merge-multiple: true
      - name: Attest package provenance
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: bundle/*.tgz
          push-to-registry: false
          create-storage-record: false
      - name: Verify artifact and exact signer identity
        env:
          GH_TOKEN: ${{ github.token }}
          ATTESTATION_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
          SOURCE_SHA: ${{ github.sha }}
        run: >-
          gh attestation verify bundle/*.tgz
          --bundle "$ATTESTATION_BUNDLE"
          --repo danielcg-net/bizyeet-ai-tools
          --signer-workflow danielcg-net/bizyeet-ai-tools/.github/workflows/provenance.yml
          --source-ref refs/heads/main
          --source-digest "$SOURCE_SHA"
          --signer-digest "$SOURCE_SHA"
          --deny-self-hosted-runners
      - name: Retain signed provenance evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trusted-provenance-${{ github.sha }}
          path: ${{ steps.provenance.outputs.bundle-path }}
          if-no-files-found: error
          retention-days: 7
