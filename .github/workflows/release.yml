          gh attestation verify bundle/*.tgz --bundle signed/provenance.sigstore.json --repo danielcg-net/bizyeet-ai-tools --signer-workflow danielcg-net/bizyeet-ai-tools/.github/workflows/release.yml --source-ref refs/heads/main --source-digest "$SOURCE_SHA" --signer-digest "$SOURCE_SHA" --deny-self-hosted-runners
