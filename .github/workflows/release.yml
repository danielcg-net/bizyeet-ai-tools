          - ubuntu-latest
          - macos-latest
          - windows-latest
        node:
          - 24
          - 26
    steps:
      - name: Checkout exact dispatch SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up uncached Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Verify exact beta metadata and full installed package gate
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          npm ci --ignore-scripts
          npm run release:preflight -- --tag "$RELEASE_TAG"
          npm run release:verify
          git diff --exit-code
          git diff --cached --exit-code
  build:
    if: github.repository == 'danielcg-net/bizyeet-ai-tools' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    needs:
      - readiness
      - matrix
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      artifact-id: ${{ steps.bundle.outputs.artifact-id }}
    steps:
      - name: Checkout exact dispatch SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up uncached Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          package-manager-cache: false
      - name: Build canonical verified release bundle
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          PUBLICATION_REQUESTED: ${{ inputs.publish }}
        run: |
          npm ci --ignore-scripts
          npm run release:preflight -- --tag "$RELEASE_TAG"
          npm run release:verify
          node dist/scripts/release-publication.js --tag "$RELEASE_TAG"
          git diff --exit-code
          git diff --cached --exit-code
      - name: Retain canonical candidate
        id: bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-candidate-${{ github.run_id }}
          path: release-artifacts/
          if-no-files-found: error
          retention-days: 90
      - name: Present canonical candidate before approval
        env:
          CANDIDATE_ARTIFACT_ID: ${{ steps.bundle.outputs.artifact-id }}
          PUBLICATION_REQUESTED: ${{ inputs.publish }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: node dist/scripts/release-review-summary.js
